validation_task:
  description: >
    这是最终审核关卡。请对前面的行程草案进行“逻辑压力测试”：
    1. 检查景点间的通勤时间是否足够（使用搜索工具验证距离）。
    2. 检查当日天气是否支持户外活动。
    3. 检查总体预算是否合理。
    
    如果发现任何不合理（自相矛盾），你必须在回复中明确写出“逻辑错误：[具体原因]”，并要求打回修正。
    如果完美无缺，则将其转化为最终的报告。
  expected_output: >
    一份经过逻辑确认、完美且可直接交付用户的最终旅游指南。
  agent: logic_validator_agent