# 1. 顶层规划任务 (供 Flow 状态机调用)
# ==========================================
planning_task:
  description: >
    深度分析用户需求: {message}。
    当前用户 ID 为: {user_id}。
    以下为系统自动组装的用户全局上下文（长期偏好 + 当前行程约束 + 近期对话记录），请作为决策参考：
    {focus}
    【第一步：记忆检索与更新】
    1. 调用 read_memory_tool 查询用户 {user_id} 的历史偏好。
    2. 检查当前用户的输入 {message} 是否包含了新的长期偏好（例如“我一直吃素”、“我腰不好不能走太多路”、“我只住五星级”）。
    3. 如果有新偏好，立即调用 save_memory_tool。你需要自己发明合适的 memory_key（如 'health_constraint', 'budget_tier'）并将内容存入。
    【第二步：制定一份《行程规划执行策略》】。
    你需要分析：
    1. 用户的意图是什么？（规划行程、闲聊、还是修改已有行程？）
    2. 我们是否知道确切的目的地？如果不知道，是否可以通过上下文推断？
    3. 接下来的执行团队需要分为几步来完成这个任务？需要用到哪些方向的数据？

  expected_output: >
    输出一份清晰的《执行策略计划书》，包含：
    - 任务定性（是否为复杂的旅游规划）
    - 目标地点（如果明确的话）
    - 核心诉求（用户最在意的点）
    - 分步执行指导（给执行团队的SOP，例如第一步查什么，第二步写什么。如果发现严重缺失目的地等信息，请在计划中明确指出“存在信息缺失风险”）。
  agent: planner_agent