# src/agent_test0/config/logic_validator_tasks.yaml
validation_task:
  description: >
    你是行程规划流的终审判官与状态机路由守卫。

    【原始计划与约束】:
    {plan_document}

    【执行团队最新提交的草案】:
    {draft}

    【审核模式】
    - 如果提供了 {current_step_instruction}：进行【单步骤审核】，只审核该步骤
    - 如果没有提供：进行【全局审核】，审核整个计划

    一. 单步骤审核模式
    请对比计划与草案，按照以下逻辑进行严格评估：

    1. 判断【当前最新步骤】{current_step_instruction} 的任务是否已经做完且达标？
      1.1 信息是否严重缺失？（草案中是否提到不知道去哪，或者发现根本无法满足用户的核心诉求，因为缺少关键数据且工具查不到）。
      1.2 逻辑是否严重错误？（景点距离不合理、违反用户禁忌）。
      1.3 是否完美达标？

    二. 全局审核模式
    如果没有提供 {current_step_instruction}，请审核整个计划：

    1. 审核所有步骤是否都已完成
    2. 检查步骤之间是否有矛盾
    3. 检查整体计划是否可行

    【反馈格式】：
    你必须以以下标签之一开头，并紧跟 JSON 格式的详细反馈：

    [通过] 如果当前步骤/整体计划完美达标
    [重试] 如果当前步骤失败，但可以重试（如网络错误、工具调用失败）
    [失败步骤列表] 如果多个步骤失败，需要局部修复（输出 failed_step_ids 列表）

    【为什么这是错误的】(如果失败)：
    - 违反原则：[用户约束/逻辑矛盾/工具使用规范]
    - 影响范围：[仅影响当前步骤/会影响后续步骤/导致整体失败]
    - 修复建议：[针对每个失败步骤的具体修正]

  expected_output: >
    你必须以标签开头，后跟 JSON 格式的详细反馈：

    示例1（通过）：
    [通过]
    ```json
    {
      "verdict": "pass",
      "feedback": {
        "passed": true,
        "feedback_type": "pass",
        "reason": "步骤完成，天气数据准确"
      }
    }
    ```

    示例2（重试）：
    [重试]
    ```json
    {
      "verdict": "retry",
      "feedback": {
        "passed": false,
        "feedback_type": "retry",
        "reason": "天气工具调用失败，稍后重试",
        "retry_count": 1
      }
    }
    ```

    示例3（失败步骤列表 - 局部修复）：
    [失败步骤列表]
    ```json
    {
      "verdict": "fail_with_patches",
      "failed_step_ids": [2, 4],
      "global_feedback": {
        "reason": "步骤2天气数据缺失且工具无法获取，步骤4行程安排过于紧凑",
        "suggested_corrections": {
          "2": "使用备用天气数据源或询问用户",
          "4": "将行程从6个景点减少到3个，每个景点停留时间减半"
        }
      }
    }
    ```
  agent: logic_validator_agent