# config/tasks.yaml
# Planner 状态任务：复杂度判定 + 缺失信息判断 + 粗粒度步骤生成

planning_task:
  description: >
    用户消息: {message}
    用户 ID: {user_id}
    上下文（系统自动注入长期偏好 + 近期原始对话）: {focus}
    历史计划: {previous_plan} | 当前工单: {current_step} | 进度草案: {current_draft}

    【示例卫生规则 — 绝对重要】
    - 本配置中的 <目的地>、<天数>、<预算>、<人数> 都只是 JSON 结构占位符。
    - 严禁把占位符或示例数字当成用户默认值。
    - 用户没有明确提供的信息，只能标为"未指定"，或设置 needs_user_input=true 向用户追问。

    【先提取用户真实提供的信息】
    1. 目的地: 用户说了哪个城市/地区就原样填入 location；没说则填"未知"。
    2. 天数: 用户说了几天就记录在 focus；没说则视为"未指定"。
    3. 预算: 用户说了就记录在 focus；没说则视为"未指定"。
    4. 人数: 用户说了就记录在 focus；没说则视为"未指定"。
    5. 意图: 行程规划 / 查询天气 / 闲聊 / 修改已有计划。

    【关于上下文】
    - focus 里包含长期偏好和近期原始对话，请只把它当作已知信息来源。
    - 不要调用任何记忆工具，记忆读写由系统代码管理。
    - 如果 focus 中有 assistant 最近已经向用户询问过天数/预算/人数，而用户本轮明确说"看你安排"、"随便"、"默认"、"你决定"等，才允许做合理假设。

    【何时向用户提问】
    场景 A — 目的地缺失：
    - 必须 needs_user_input=true，询问用户想去哪个城市/地区。
    - 不要自己推荐或默认目的地。

    场景 B — 目的地明确，但天数/预算/人数等关键信息缺失：
    - 如果这是第一次回应该旅行需求，必须 needs_user_input=true，把缺失信息一次性问全。
    - 不要直接造步骤，不要把未提供信息填成默认值。
    - 如果已经问过一次，且用户明确授权你自行安排，才可以在 assumptions 中写出你做出的假设并继续规划。

    场景 C — 查询天气 / 简单事实：
    - 如果用户只问天气、温度、是否下雨等，不需要追问天数/预算/人数。
    - 可以生成单个查询步骤，或 simple_answer。

    场景 D — 闲聊：
    - 直接 simple_answer 回复，is_complex=false，不要生成 steps。

    【制定执行步骤】
    - 仅当信息足以继续执行（或用户已明确授权默认）时生成 steps。
    - 步骤数控制在 1-5 个，每个步骤必须有可验证输出。
    - 查询类步骤围绕用户真实目的地或真实问题展开。
    - 纯整合/撰写类步骤可以不需要工具。

  expected_output: >
    严格输出一份 JSON（只输出 JSON，不要任何其他文字，可以放在 ```json 代码块中）：

    - is_complex: bool — 是否需要多步骤规划
    - location: string — 用户说的目的地原文；未指定则填"未知"
    - focus: string — 核心诉求，只包含用户真实提供的信息与必要说明
    - assumptions: list[string] — 只有用户已授权默认时才写入；没有假设则空列表
    - steps: list[object] — 粗粒度执行步骤；信息不足需要追问时必须为空数组
      - index: int (从0开始)
      - description: string (做什么，如"查询<目的地>天气")
      - dependencies: list[int] (前置步骤索引)
    - needs_user_input: bool — 信息不足需要用户补充时为 true
    - user_question: string — needs_user_input=true 时填具体问题
    - simple_answer: string — 闲聊或简单回答时直接给答案，is_complex=false
    - plan_summary: string — 计划简述；如果有 assumptions，必须明确披露

    示例 1（目的地明确，但首次缺少天数/预算/人数 → 提问）：
    ```json
    {
      "is_complex": false,
      "location": "<目的地>",
      "focus": "<目的地>行程规划，等待补充天数、预算、人数",
      "assumptions": [],
      "steps": [],
      "needs_user_input": true,
      "user_question": "好的，<目的地>行程没问题！为了规划得更贴合您的需求，请告诉我：\n① 计划玩几天？\n② 大概预算是多少？\n③ 几位出行？\n如果都没特别要求，也可以回复‘看你安排’，我会按常规方案继续。",
      "simple_answer": "",
      "plan_summary": "首次询问<目的地>行程的关键信息"
    }
    ```

    示例 2（已问过一次，且用户明确授权默认 → 可假设并继续）：
    ```json
    {
      "is_complex": true,
      "location": "<目的地>",
      "focus": "<目的地>行程规划；用户授权系统自行安排缺失约束",
      "assumptions": ["用户授权默认天数，按常规短途行程规划", "用户授权默认预算，按常规舒适档位估算", "用户授权默认人数，按常规同行规模估算"],
      "steps": [
        {"index": 0, "description": "查询<目的地>天气和出行季节信息", "dependencies": []},
        {"index": 1, "description": "检索<目的地>热门景点和开放信息", "dependencies": []},
        {"index": 2, "description": "结合天气、景点和用户授权假设规划行程", "dependencies": [0, 1]}
      ],
      "needs_user_input": false,
      "user_question": "",
      "simple_answer": "",
      "plan_summary": "用户授权系统对缺失信息做常规假设，并继续生成<目的地>行程"
    }
    ```

    示例 3（目的地完全缺失 → 提问）：
    ```json
    {
      "is_complex": false,
      "location": "未知",
      "focus": "目的地不明",
      "assumptions": [],
      "steps": [],
      "needs_user_input": true,
      "user_question": "请问您想去哪个城市或地区旅游？",
      "simple_answer": "",
      "plan_summary": "信息不足，向用户询问目的地"
    }
    ```

    示例 4（闲聊）：
    ```json
    {
      "is_complex": false,
      "location": "未知",
      "focus": "闲聊",
      "assumptions": [],
      "steps": [],
      "needs_user_input": false,
      "user_question": "",
      "simple_answer": "你好！我是你的旅行规划助手。告诉我你想去哪儿、玩几天和预算，我可以帮你安排行程。",
      "plan_summary": "闲聊回复"
    }
    ```
  agent: planner_agent
