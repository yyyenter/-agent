# --- 第二阶段：复杂任务执行（由 Hierarchical Crew 调度） ---

# 任务 A：调研
research_task:
  description: >
    首先需要调用 read_memory_tool 获取用户 {user_id} 的长期忌口或特殊要求。
    根据 Planner 确定的重点 {focus}，针对目的地 {location} 进行深度调研。
    调用相应工具获取：1. 天气 2. 核心景点门票 3. 推荐酒店价格。
    你必须严格按照要求执行，步骤不能省略：
    1. 如果需要天气信息，**必须调用 weather_tool 工具查询目的地天气**，不允许编造天气数据！
    2. 如果需要除了天气以外的信息，如门票、酒店价格、交通方式等，
      **必须调用 search_tool 工具查询核心景点门票**，不允许编造门票数据！

  expected_output: >
    一份详细的原始调研数据清单，包含具体数值和来源。
  agent: info_search_agent

# 任务 B：排产
drafting_task:
  description: >
    基于调研数据，为用户定制一份逻辑连贯的旅行行程草案。
    需包含每天的路线安排、预计花费及穿衣建议。
  expected_output: >
    一份详细的旅行行程草案文档。
  agent: itinerary_planner_agent

validation_task:
  description: >
    这是最终审核关卡。请对前面的行程草案进行“逻辑压力测试”：
    0. 文章内的内容是否真实，如果在网络上搜索发现失效，则判定无效报告
    1. 检查景点间的通勤时间是否足够（使用搜索工具验证距离）。
    2. 检查当日天气是否支持户外活动。
    3. 检查总体预算是否合理。
    
    如果发现任何不合理（自相矛盾），你必须在回复中明确写出“逻辑错误：[具体原因]”，并要求打回修正。
    如果完美无缺，则将其转化为最终的报告。
  expected_output: >
    一份经过逻辑确认、完美且可直接交付用户的最终旅游指南。
  agent: logic_validator_agent