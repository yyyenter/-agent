# 1. 顶层规划任务 (供 Flow 状态机调用)
# ==========================================
planning_task:
  description: >
    深度分析用户需求: {message}。
    当前用户 ID 为: {user_id}。
    以下为系统自动组装的用户全局上下文（长期偏好 + 当前行程约束 + 近期对话记录），请作为决策参考：
    {focus}
    【第一步：记忆检索与更新】
    1. 调用 read_memory_tool 查询用户 {user_id} 的历史偏好。
    2. 检查当前用户的输入 {message} 是否包含了新的长期偏好（例如“我一直吃素”、“我腰不好不能走太多路”、“我只住五星级”）。
    3. 如果有新偏好，立即调用 save_memory_tool。你需要自己发明合适的 memory_key（如 'health_constraint', 'budget_tier'）并将内容存入。
    【第二步：任务规划】
    1. 【复杂度判定 (is_complex)】：
       - 如果是简单的实事查询（如：今天天气、徐州有什么好吃的、故宫门票多少钱），设为 false。
       - 如果是需要制定多天行程、路线安排、逻辑整合的复杂规划，设为 true。
    2. 【简单回答 (simple_answer)】：
       - 如果 is_complex 为 false，结合你的常识在这里直接给出简短的答案。
       - 如果 is_complex 为 true，请留空 ("")。
    3. 【实体与工具 (location & tools_needed)】：
       - 提取目的地 location（如果没有明确地点，设为"未知"）。
       - 预估这趟复杂任务需要用到的工具列表 tools_needed (可选: "weather_tool", "search_tool",)。
    4. 个性化合规检查：调用 read_memory_tool 获取用户 {user_id} 的长期忌口或特殊要求。
    如果草案中推荐了用户忌口的食物或不喜欢的出行方式，视为逻辑错误打回。
    
    !!! 必须且只能输出合法的 JSON 字符串，绝对禁止任何 Markdown 标记 (如 ```json) 或多余的文字解释 !!!
    示例格式：
    {
      "is_complex": false,
      "simple_answer": "杭州的特色美食是地锅鸡和烧烤。",
      "location": "杭州",
      "tools_needed": ["search_tool"]
    }
  expected_output: >
    包含 is_complex, simple_answer, location 和 tools_needed 的纯 JSON 字符串。
  agent: planner_agent