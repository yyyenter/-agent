# 1. 顶层规划任务 (供 Flow 状态机调用)
# ==========================================
planning_task:
  description: >
    用户消息: {message}
    用户 ID: {user_id}
    上下文（系统已自动注入历史偏好+当前会话约束）: {focus}
    历史计划: {previous_plan} | 当前工单: {current_step} | 进度草案: {current_draft}

    【最关键 — 必须先提取以下信息】：
    1. 目的地: 用户说了哪个城市/地区就原样填入 location 字段。如用户说"想去杭州"，location 就是"杭州"，不要改成其他城市。
    2. 天数: 用户说了几天就填几天，没说则填"未指定"。
    3. 预算: 用户说了就填，没说则填"未指定"。
    4. 人数: 用户说了就填，没说则填"未指定"。
    5. 意图: 规划行程 / 查询天气 / 闲聊 / 修改已有计划。

    【关于上下文（focus）】
    - 上面的 focus 字段中已经包含系统从历史对话中蒸馏好的用户偏好（如"吃素"、"过敏"、"预算 5000"等）和当前会话约束。
    - 你不需要、也无法再调用任何记忆工具去读取或写入记忆——这一切由系统自动管理。
    - 你只需要把 focus 当成"已知的用户画像"，把它体现在你制定的步骤和最终计划中。

    【何时向用户提问 / 何时自己假设 — 关键决策规则】

    第一步：先看 focus 中的【近期对话上下文】，判断你（assistant）是否在最近一两轮已经向用户问过类似问题。

    场景 A — **目的地完全缺失**：
    - 这是最关键的信息。如果 focus 中没问过 → 必须发起提问（needs_user_input=true，例如"请问您想去哪个城市？"）。
    - 如果 focus 中你最近一轮已经问过目的地，但用户的最新输入仍然没说明任何城市/地区 → 不再追问，
      可以推荐 1-2 个热门目的地作为假设（如"按用户语境默认推荐杭州"），写入 assumptions，继续规划。

    场景 B — **目的地明确，但天数/预算/人数等次要信息缺失**：
    - 如果是你**第一次**回应用户的旅行需求（focus 中没有你问过这些信息的痕迹）：
      → 优先发起一次提问（needs_user_input=true），把缺失的次要信息一次性问全
        （如"为了为您规划得更贴合您的需求，请告诉我：① 计划玩几天？ ② 大概预算？ ③ 几个人出行？"）。
      → **不要**直接造步骤，先等用户答。
    - 如果你**已经问过一次**（focus 中能看到 assistant 上一轮就问了这些），
      但用户的本轮回答里仍然没补全这些信息（比如只说"看你安排"、"无所谓"、"随便"、或干脆不答）：
      → **不要再追问**。立刻自己做合理假设（天数=3 天、预算=中等档位人均 1000/天、人数=2 人），
        把每个假设写进 assumptions 列表，继续生成 steps 推进规划。

    场景 C — **闲聊**（你好、你是谁、感谢等）：
    - 直接 simple_answer 回复，is_complex=false，不要造步骤。

    简而言之：**第一次缺信息 → 问一次；第二次还是缺 → 自己假设并写进 assumptions**。

    【制定执行步骤】
    根据目的地是否明确来制定步骤：
    - 如果目的地明确（如"杭州3天"、"杭州"+假设3天）：步骤直接围绕该目的地展开（查当地天气→查景点→排行程→出报告）
    - 如果目的地不明确：needs_user_input=true 直接提问，不要造步骤
    - 步骤数控制在 2-5 个，每个步骤必须有可验证的输出

  expected_output: >
    严格输出一份 JSON（**只输出 JSON，不要任何其他文字**，可以放在 ```json 代码块中）：

    - is_complex: bool — 是否需要多步骤规划
    - location: string — 用户说的目的地原文（如"杭州"、"云南"），未指定则填"未知"
    - focus: string — 核心诉求
    - assumptions: list[string] — 你做出的关键假设（如 "默认 3 天行程"、"按中等预算规划"），没假设则空列表
    - steps: list[object] — 粗粒度执行步骤
      - index: int (从0开始)
      - description: string (做什么，如"查询杭州天气")
      - dependencies: list[int] (前置步骤索引)
    - needs_user_input: bool — 第一次缺次要信息（天数/预算/人数）时为 true；目的地缺失也为 true
    - user_question: string — needs_user_input=true 时填具体问题
    - simple_answer: string — 是闲聊或简单问候时直接给答案，is_complex=false
    - plan_summary: string — 计划简述，**必须包含 📌 假设说明**（如有 assumptions）

    示例 1（用户首次说"想去杭州" → 第一次问次要信息）：
    ```json
    {
      "is_complex": false,
      "location": "杭州",
      "focus": "杭州行程规划，等待补充次要信息",
      "assumptions": [],
      "steps": [],
      "needs_user_input": true,
      "user_question": "好的，杭州行程没问题！为了规划得更贴合您的需求，请告诉我：\n① 计划玩几天？\n② 大概预算？\n③ 几位出行？\n如果都没特别要求，回复\"看你安排\"我也可以帮您按常规方案规划。",
      "simple_answer": "",
      "plan_summary": "首次询问杭州行程的次要约束"
    }
    ```

    示例 2（已问过一次，用户回复"看你安排"或仍未给次要信息 → 自己假设并继续）：
    ```json
    {
      "is_complex": true,
      "location": "杭州",
      "focus": "杭州行程规划",
      "assumptions": ["用户未指定天数，默认按 3 天规划", "未指定预算，按中等档位人均 1000/天", "未指定人数，按 2 人估算"],
      "steps": [
        {"index": 0, "description": "查询杭州天气和旅行季节信息", "dependencies": []},
        {"index": 1, "description": "检索杭州热门景点", "dependencies": []},
        {"index": 2, "description": "规划杭州3天详细行程", "dependencies": [0, 1]},
        {"index": 3, "description": "整合生成最终旅行计划", "dependencies": [2]}
      ],
      "needs_user_input": false,
      "user_question": "",
      "simple_answer": "",
      "plan_summary": "📌 假设：3 天行程、中等预算（约人均 1000/天）、2 人出行。如需调整请告诉我。\n为用户规划杭州 3 天旅行，先查天气和景点，再排行程"
    }
    ```

    示例 3（目的地完全缺失 → 必须提问）：
    ```json
    {
      "is_complex": false,
      "location": "未知",
      "focus": "目的地不明",
      "assumptions": [],
      "steps": [],
      "needs_user_input": true,
      "user_question": "请问您想去哪个城市旅游呢？",
      "simple_answer": "",
      "plan_summary": "信息不足，向用户询问目的地"
    }
    ```

    示例 4（闲聊/简单回答）：
    ```json
    {
      "is_complex": false,
      "location": "未知",
      "focus": "闲聊",
      "assumptions": [],
      "steps": [],
      "needs_user_input": false,
      "user_question": "",
      "simple_answer": "你好！我是你的旅行规划助手，告诉我你想去哪儿，我帮你安排行程。",
      "plan_summary": "闲聊回复"
    }
    ```
  agent: planner_agent
