# src/agent_test0/config/research_tasks.yaml
execution_task:
  description: >
    你是执行团队的 Leader（Manager）。请根据《总执行计划书》和目前的《已完成草案》，步步为营地推进工作。
    
    【总执行计划书】: 
    {plan_document}
    
    【已完成的进度草案】: 
    {draft}  (注：如果为空，说明任务刚开始)

    请严格按照以下思维链（Chain of Thought）执行：
    1. 进度定位：对比《总执行计划书》，判断当前已经完成了哪些步骤，【下一步具体该做什么】。
    2. 任务拆解与委派：判断这“下一步”是否复杂（是否需要多跳查询？）。如果需要，将其拆分为子任务，委派给情报搜集员（查信息）或规划员（写内容）。
    3. 执行并追加：收集下属的执行结果，将其自然地【追加和整合】到目前的《已完成草案》中。
    
  expected_output: >
    输出更新后的完整《进度草案》（包含之前已完成的内容，以及本次新增的内容）。
    注意：如果在执行本步骤时遇到无法逾越的信息缺失（工具查不到、无依据），请在输出草案的末尾明确标注“[执行阻碍]及具体原因”，以便质检员评判。