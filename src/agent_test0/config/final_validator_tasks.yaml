# config/final_validator_tasks.yaml
# FinalVerifier 状态任务：整体审核最终计划
#
# 设计原则：宽松通过（liberal pass）。
# FinalVerifier 默认 pass。仅在以下硬故障时才 fail_with_patches：
#   1) 计划与用户硬性约束冲突（用户明确说不去 X，但行程包含 X）
#   2) 同一步骤内部存在严重逻辑矛盾（如同一天既说去 A 又说去 B 的冲突时段）
#   3) 全部步骤的结果都是空字符串（说明根本没拿到数据）
# **不要**因为"细节不够""可以更全面""建议补充更多信息"等理由判 fail。
# 完美程度由后续 _generate_final_report 这个 LLM 合成阶段补足。

final_validator_task:
  description: >
    你是一个【终审质检官】。你的职责是判断完整旅游计划是否"可交付给用户"。
    交付标准是"可用"而不是"完美"——细节不够、文风不够好都不是你的问题，
    它们会在后面的报告生成 LLM 中被补全。

    【完整计划】:
    所有步骤及结果: {all_steps_with_results}
    总体计划文档: {full_plan_document}

    【判定规则 - 严格按此 4 条决策，不要自由发挥】:

    ✅ 一律判 pass 的情况（**默认 pass**）：
       - 至少一个步骤有非空 result
       - 没有步骤结果直接违反用户约束
       - 没有跨步骤的硬性矛盾
       - 哪怕"细节不全""文笔粗糙""缺少某些子项"，**仍判 pass**
       - 哪怕某些步骤工具失败但其它步骤有数据，**仍判 pass**

    ❌ 仅以下 3 种情况判 fail_with_patches：
       1. 计划违反用户硬性约束（如用户说不去 X 但行程有 X）
       2. 跨步骤存在严重逻辑矛盾（如同一时段既说去 A 又说去 B）
       3. 全部步骤的 result 都是空字符串

    【对边界情况的明确指引】:
    - "完整性 90/100，但缺少天气季节细节" → pass（细节由后续 LLM 补）
    - "可行性 70/100，因为行程紧" → pass（合成报告时可以微调）
    - "建议补充更多内容" → pass（不是 FinalVerifier 的事）
    - **拿不准就 pass**

  expected_output: >
    严格输出 JSON（放在 ```json 代码块中），只输出 JSON 不要其他文字：
    - global_verdict: string, 取值仅限 "pass" | "fail_with_patches"
    - reason: string, 一句话说明为什么这样判
    - failed_step_ids: list[int]  (仅 fail_with_patches 时填，命中硬规则的步骤索引)
    - suggested_corrections: object  (仅 fail_with_patches 时填，key 是步骤索引字符串)

    示例 1（默认通过）：
    ```json
    {
      "global_verdict": "pass",
      "reason": "至少一个步骤有数据，且无硬性冲突，可交付给报告合成阶段"
    }
    ```

    示例 2（违反用户硬约束 - 必须 fail）：
    ```json
    {
      "global_verdict": "fail_with_patches",
      "reason": "用户硬性表态不吃辣，但步骤 2 推荐了麻辣火锅",
      "failed_step_ids": [2],
      "suggested_corrections": {
        "2": "替换为非辣餐饮（如杭帮菜）"
      }
    }
    ```
  agent: final_verifier_agent
